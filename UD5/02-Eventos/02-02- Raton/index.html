<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eventos del ratón</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Carrois+Gothic+SC&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../../assets/css/style.css" />
  </head>
  <body>
    <div class="contenido min-h-screen bg-slate-300">
      <h1>DWEC 22-23</h1>
      <p>UD4.-Interacción con el usuario. Eventos y formularios</p>
      <h2 class="hashtag">02-02- Ratón</h2>
    </div>
    <section id="form-register">
      <form action="" method="post" autocomplete="off">
        <h4>Formulario</h4>
        <p>Abre la consola para ver los eventos. Pasa el ratón por los campos
          (azul) y arrastra con el botón principal pulsado (amarillo).
          Prueba también el doble clic y el clic secundario.</p>
        <input
          class="controls"
          type="text"
          name="nombre"
          id="nombreId"
          value="María"
          placeholder="Introduzca nombre"
        />
        <input
          class="controls"
          type="text"
          name="apellidos"
          id="apellidosId"
          value="Juan"
          placeholder="Introduzca apellidos"
        />

        <button type="submit" class="botons">Enviar</button>
      </form>
    </section>
    <div>
      <script src="./js/app.js"></script>
      <noscript>El navegador no soporta JavaScript</noscript>
    </div>
  </body>
</html>
